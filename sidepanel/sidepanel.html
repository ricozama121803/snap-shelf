<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Snap Shelf</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header id="app-header">
      <div id="search-row">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="search" placeholder="Search your Snap Shelf... (press /)" aria-label="Search saved items" />
      </div>
      <div id="filter-row" role="toolbar" aria-label="Filters">
        <button class="chip active" data-filter-type="all" type="button">All</button>
        <button class="chip" data-filter-type="favorite" type="button">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Favorites
        </button>
        <button class="chip" data-filter-type="text" type="button">Text</button>
        <button class="chip" data-filter-type="screenshot" type="button">Screenshots</button>
        <button class="chip" data-filter-type="image" type="button">Images</button>
        <select id="tag-filter" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
      </div>
    </header>

    <main id="app-main" tabindex="-1">
      <div id="empty-state" hidden>
        <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" opacity="0"/><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/></svg>
        <p id="empty-state-title">Nothing saved yet</p>
        <ul id="empty-state-list">
          <li>Highlight text, then right-click &rarr; <strong>Save selection to Snap Shelf</strong></li>
          <li>Right-click any image &rarr; <strong>Save image to Snap Shelf</strong></li>
          <li>Right-click empty space on the page &rarr; <strong>Capture screenshot region</strong> <kbd>Ctrl+Shift+S</kbd></li>
        </ul>
      </div>
      <ul id="item-list" aria-label="Saved items"></ul>
      <button id="load-more" type="button" hidden>Load more</button>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message"></span>
      <button id="toast-undo" type="button">Undo</button>
    </div>

    <dialog id="image-modal">
      <button id="image-modal-close" type="button" aria-label="Close image">&times;</button>
      <img id="image-modal-img" alt="" />
    </dialog>

    <dialog id="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit item</h2>
        <label for="edit-note">Note</label>
        <textarea id="edit-note" rows="3" placeholder="Add a short note..."></textarea>
        <label for="edit-tags-input">Tags</label>
        <div id="edit-tags-list"></div>
        <input id="edit-tags-input" type="text" placeholder="Add a tag and press Enter" />
        <div class="dialog-actions">
          <button id="edit-cancel" type="button" class="btn-secondary">Cancel</button>
          <button id="edit-save" type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <template id="item-card-template">
      <li class="item-card" tabindex="-1">
        <div class="card-thumb"></div>
        <div class="card-body">
          <div class="card-meta">
            <img class="favicon" alt="" />
            <span class="domain"></span>
            <span class="dot">&middot;</span>
            <time class="timestamp"></time>
          </div>
          <div class="card-title"></div>
          <div class="card-snippet"></div>
          <div class="card-note"></div>
          <div class="card-tags"></div>
        </div>
        <div class="card-actions">
          <button class="action-btn action-favorite" type="button" aria-label="Toggle favorite" title="Favorite (F)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          <button class="action-btn action-edit" type="button" aria-label="Edit" title="Edit (E)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="action-btn action-copy" type="button" aria-label="Copy" title="Copy (C)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="action-btn action-open" type="button" aria-label="Open original page" title="Open (Enter)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          </button>
          <button class="action-btn action-delete" type="button" aria-label="Delete" title="Delete (Del)">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </li>
    </template>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
